# Weekly re-crawl of all sources + FAISS index rebuild, run directly on
# the GitHub runner (scripts/recrawl.sh).
#
# Crawl state (crawler/output/*.jsonl — the crawlers skip URLs already in
# it) is carried from week to week as the `crawl-state` artifact of the
# last successful run. Without one (first run, or the last success is
# older than the artifact retention) this is a full crawl, ~2–2.5 h.
# That run's `index` artifact is restored into data/ as well, so
# build_index.py only embeds new or changed chunks and skips the build
# entirely when nothing changed.
# The built index is published as the `index` artifact; fetch it with
# scripts/download-index.sh, then scripts/upload-index.sh + redeploy.
#
# The repo is public, so these artifacts are downloadable by anyone —
# fine for crawled public government pages, but never put secrets or
# backend/.env-derived data in them. Retention is 30 days so one or two
# failed weeks still leave a crawl state to resume from.
#
# This used to run in a Daytona sandbox; on 2026-09-20 Daytona started
# rejecting per-sandbox domain allow lists on Tier 1/2, and the tier
# default egress does not reach the government sites.
#
# Repo secret required: OPENAI_API_KEY.
name: weekly-crawl

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch:

concurrency: weekly-crawl

permissions:
  contents: read
  actions: read # gh run download of last week's crawl state

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install crawler dependencies
        run: pip install -r crawler/requirements.txt

      - name: Restore crawl state + index from the last successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p crawler/output data
          run_id=$(gh run list --workflow weekly-crawl.yml --status success --limit 1 \
            --json databaseId -q '.[0].databaseId')
          if [ -n "$run_id" ] && gh run download "$run_id" -n crawl-state -D crawler/output; then
            echo "restored crawl state from run $run_id:"
            wc -l crawler/output/*.jsonl
          else
            echo "no crawl state available — full crawl"
          fi
          if [ -n "$run_id" ] && gh run download "$run_id" -n index -D data; then
            echo "restored index from run $run_id (built $(cat data/published_at))"
          else
            echo "no previous index available — full re-embed"
          fi

      - name: Crawl + build index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -o pipefail
          bash scripts/recrawl.sh 2>&1 | tee crawl.log
          # build_index.py leaves data/ untouched when nothing changed;
          # keep the restored stamp then, so it still says when the
          # index was actually built.
          if ! grep -q "unchanged since the previous build" crawl.log; then
            date -u +%FT%TZ > data/published_at
          fi

      - name: Upload crawl state
        uses: actions/upload-artifact@v4
        with:
          name: crawl-state
          path: crawler/output/*.jsonl
          retention-days: 30

      - name: Upload index
        uses: actions/upload-artifact@v4
        with:
          name: index
          path: |
            data/faiss_index.bin
            data/metadata.db
            data/published_at
          retention-days: 30

      - name: Upload crawl log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-log
          path: crawl.log
          if-no-files-found: ignore
          retention-days: 30
