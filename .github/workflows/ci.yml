name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        # setuptools ships with the venv, not from our requirements files —
        # upgrade it explicitly so pip-audit doesn't flag a stale bundled copy.
        run: |
          pip install --upgrade pip setuptools
          pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend

      - name: Test
        run: python -m pytest backend/tests/ -q

      - name: Audit dependencies (pip-audit)
        # PYSEC-2026-1845 (pytest, dev-only, needs a pytest 9 major bump) and
        # the starlette CVEs (transitive via the fastapi==0.111.0 pin, fix
        # needs a fastapi major bump) are known and accepted for now — both
        # require a breaking-change upgrade to clear. Everything else must
        # stay clean.
        run: >
          pip-audit
          --ignore-vuln PYSEC-2026-1845
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-1943
          --ignore-vuln PYSEC-2026-1941
          --ignore-vuln PYSEC-2026-2281
          --ignore-vuln PYSEC-2026-2280

  crawler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawler/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools
          pip install -r crawler/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check crawler

      - name: Test
        working-directory: crawler
        run: python -m pytest tests/ -q

      - name: Audit dependencies (pip-audit)
        # PYSEC-2026-1845 (pytest, dev-only, needs a pytest 9 major bump) is
        # known and accepted for now. Everything else must stay clean.
        run: pip-audit --ignore-vuln PYSEC-2026-1845

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (typecheck)
        run: npm run build
