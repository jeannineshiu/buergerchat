# Ship an already-built index to production without re-crawling: download
# the `index` artifact of a weekly-crawl run, then the same ship + smoke
# test steps weekly-crawl.yml runs after a build. For when the crawl
# succeeded but shipping failed (2026-09-27: bad RAILWAY_TOKEN secret), or
# to go back to an older run's index.
#
#   gh workflow run ship-index.yml -f run_id=<weekly-crawl run id>
#
# Without run_id it takes the latest *successful* weekly-crawl run — which
# is not the one whose ship step failed, since that run counts as failed.
#
# Its own workflow, not a mode of weekly-crawl, on purpose: weekly-crawl
# restores its crawl state from its last successful run, and a ship-only
# run has no crawl-state artifact, so it would force a full crawl next week.
name: ship-index

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "weekly-crawl run whose index to ship (default: latest successful)"
        required: false

# Shared with weekly-crawl so a manual ship never races the Sunday one.
concurrency: weekly-crawl

permissions:
  contents: read
  actions: read # gh run download of the index artifact

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download index
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: bash scripts/download-index.sh $RUN_ID

      # Keep in step with the ship step in weekly-crawl.yml.
      - name: Ship index to production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          [ -n "$RAILWAY_TOKEN" ] || { echo "::error::RAILWAY_TOKEN secret is not set"; exit 1; }
          npm install -g @railway/cli@5.59.0
          bash scripts/ship-index.sh

      # ~$0.10 of the daily OpenAI budget, as after a weekly ship.
      - name: Smoke-test production
        run: python scripts/smoke_test.py --mode full
