# Railway config for the frontend service (config-as-code is per-service —
# set this service's Root Directory to `frontend` in the Railway dashboard).
#
# Required service variable (set in the dashboard, it becomes a Docker build
# arg): NEXT_PUBLIC_API_URL = https://${{backend.RAILWAY_PUBLIC_DOMAIN}}
# It must be the backend's PUBLIC domain — the browser calls it directly,
# so the .railway.internal URL would not be reachable.
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
